<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blob">
  <title>Audio Reactive Blob</title>
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="/icon.svg">
</head>
<body>
  <div id="container"></div>

  <div class="panel" id="sidebar">
    <h2 class="panel-title">3D BLOB</h2>

    <!-- Audio Section -->
    <div class="section">
      <div class="section-header">AUDIO REACTIVE</div>
      <div class="control-group">
        <button id="micBtn" class="control-btn">Microphone</button>
        <label for="audioFile" id="fileBtn" class="control-btn">Upload Audio</label>
        <input type="file" id="audioFile" class="file-input-ios">
      </div>
      <div id="statusText" class="status-text">Click a button to start</div>
      <div id="scrubberContainer" class="scrubber-container" style="display: none;">
        <input type="range" id="scrubber" min="0" max="100" step="0.1" value="0" class="scrubber">
        <div class="scrubber-times">
          <span id="currentTime">0:00</span>
          <span id="totalTime">0:00</span>
        </div>
      </div>
      <div class="frequency-bars">
        <div class="freq-row">
          <span class="bar-label">BASS</span>
          <div class="bar-track"><div class="bar-fill" id="bassBar"></div></div>
        </div>
        <div class="freq-row">
          <span class="bar-label">MID</span>
          <div class="bar-track"><div class="bar-fill" id="midBar"></div></div>
        </div>
        <div class="freq-row">
          <span class="bar-label">HIGH</span>
          <div class="bar-track"><div class="bar-fill" id="highBar"></div></div>
        </div>
      </div>
      <div class="slider-row" style="margin-top: 8px;">
        <label>BASS Hz</label>
        <input type="range" id="bassFreq" min="30" max="200" step="1" value="100">
        <span class="slider-value" id="bassFreqValue">100</span>
      </div>
      <div class="slider-row">
        <label>MID Hz</label>
        <input type="range" id="midFreq" min="200" max="4000" step="10" value="1000">
        <span class="slider-value" id="midFreqValue">1000</span>
      </div>
      <div class="slider-row">
        <label>HIGH Hz</label>
        <input type="range" id="highFreq" min="2000" max="16000" step="100" value="8000">
        <span class="slider-value" id="highFreqValue">8000</span>
      </div>

      <div class="slider-row" style="margin-top: 10px;">
        <label>SENSITIVITY</label>
        <input type="range" id="sensitivity" min="0.1" max="5.0" step="0.1" value="2.0">
        <span class="slider-value" id="sensitivityValue">2.00</span>
      </div>
      <div class="slider-row">
        <label>ATTACK</label>
        <input type="range" id="pulseAttack" min="0" max="1" step="0.05" value="0.85">
        <span class="slider-value" id="pulseAttackValue">0.85</span>
      </div>
      <div class="slider-row">
        <label>RELEASE</label>
        <input type="range" id="pulseRelease" min="0" max="1" step="0.05" value="0.35">
        <span class="slider-value" id="pulseReleaseValue">0.35</span>
      </div>
    </div>

    <!-- View -->
    <div class="section">
      <div class="section-header">VIEW</div>
      <div class="slider-row">
        <label>ZOOM</label>
        <input type="range" id="zoom" min="0.10" max="3" step="0.01" value="1">
        <span class="slider-value" id="zoomValue">1.00</span>
      </div>
      <div class="select-row">
        <label for="hdriSelect">BACKGROUND</label>
        <select id="hdriSelect" class="panel-select" aria-label="HDRI background">
          <option value="none">Solid</option>
          <option value="studio_small_03">Studio</option>
          <option value="kloppenheim_02">Outdoor</option>
          <option value="venice_sunset">Venice Sunset</option>
          <option value="industrial_sunset">Industrial Sunset</option>
          <option value="brown_photostudio">Studio Warm</option>
        </select>
      </div>
    </div>

    <!-- Blob Controls -->
    <div class="section">
      <div class="section-header">BLOBS</div>

      <div class="slider-row">
        <label>COUNT</label>
        <input type="range" id="blobCount" min="1" max="8" step="1" value="4">
        <span class="slider-value" id="blobCountValue">4.00</span>
      </div>

      <div class="slider-row">
        <label>SIZE</label>
        <input type="range" id="blobSize" min="0.2" max="1.8" step="0.01" value="0.8">
        <span class="slider-value" id="blobSizeValue">0.80</span>
      </div>

      <div class="slider-row">
        <label>MERGE</label>
        <input type="range" id="mergeStrength" min="0.05" max="2.0" step="0.01" value="0.7">
        <span class="slider-value" id="mergeStrengthValue">0.70</span>
      </div>

      <div class="slider-row">
        <label>SPREAD</label>
        <input type="range" id="spread" min="0.5" max="4.0" step="0.01" value="2.0">
        <span class="slider-value" id="spreadValue">2.00</span>
      </div>
    </div>

    <!-- Animation Controls -->
    <div class="section">
      <div class="section-header">ANIMATION</div>

      <div class="slider-row">
        <label>SPEED</label>
        <input type="range" id="animSpeed" min="0.0" max="3.0" step="0.01" value="1.0">
        <span class="slider-value" id="animSpeedValue">1.00</span>
      </div>

      <div class="slider-row">
        <label>DEFORMATION</label>
        <input type="range" id="deformation" min="0.0" max="1.0" step="0.01" value="0.3">
        <span class="slider-value" id="deformationValue">0.30</span>
      </div>
    </div>

    <!-- Material Controls -->
    <div class="section">
      <div class="section-header">MATERIAL</div>

      <div class="slider-row">
        <label>GLOSSINESS</label>
        <input type="range" id="glossiness" min="0.0" max="1.0" step="0.01" value="0.7">
        <span class="slider-value" id="glossinessValue">0.70</span>
      </div>
      <div class="slider-row">
        <label>OPACITY</label>
        <input type="range" id="opacity" min="0" max="1" step="0.01" value="1">
        <span class="slider-value" id="opacityValue">1.00</span>
      </div>
      <div class="slider-row">
        <label>IRIDESCENCE</label>
        <input type="range" id="iridescence" min="0" max="1" step="0.01" value="0">
        <span class="slider-value" id="iridescenceValue">0.00</span>
      </div>
      <div class="select-row">
        <label for="colorScheme">COLOR SCHEME</label>
        <select id="colorScheme" class="panel-select" aria-label="Color scheme">
          <option value="-1">Solid</option>
          <option value="0">Rainbow</option>
          <option value="1">Sunset</option>
          <option value="2">Ocean</option>
          <option value="3">Forest</option>
          <option value="4">Neon</option>
          <option value="5">Candy</option>
          <option value="6">Monochrome</option>
          <option value="7">Gold</option>
        </select>
      </div>
      <div class="slider-row">
        <label>SCHEME MIX</label>
        <input type="range" id="rainbow" min="0" max="1" step="0.01" value="0.65">
        <span class="slider-value" id="rainbowValue">0.65</span>
      </div>
    </div>

    <!-- Color & Shade -->
    <div class="section">
      <div class="section-header">COLORS</div>

      <div class="slider-row">
        <label>HUE</label>
        <input type="range" id="baseHue" min="0" max="1" step="0.01" value="0.5">
        <span class="slider-value" id="baseHueValue">0.50</span>
      </div>
      <div class="slider-row">
        <label>SAT</label>
        <input type="range" id="baseSat" min="0" max="1" step="0.01" value="0">
        <span class="slider-value" id="baseSatValue">0.00</span>
      </div>
      <div class="slider-row">
        <label>LIGHT</label>
        <input type="range" id="baseLight" min="0.3" max="1" step="0.01" value="0.92">
        <span class="slider-value" id="baseLightValue">0.92</span>
      </div>
      <div class="slider-row">
        <label>SHADOW</label>
        <input type="range" id="shadow" min="0" max="1" step="0.01" value="0.5">
        <span class="slider-value" id="shadowValue">0.50</span>
      </div>
      <div class="slider-row">
        <label>HIGHLIGHT</label>
        <input type="range" id="highlight" min="0" max="1.5" step="0.01" value="0.7">
        <span class="slider-value" id="highlightValue">0.70</span>
      </div>
    </div>
  </div>

  <button type="button" id="sidebarToggle" class="sidebar-toggle" aria-label="Toggle sidebar" title="Toggle sidebar">
    <span class="sidebar-toggle-icon" aria-hidden="true"></span>
  </button>

  <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

  <footer class="git-commit" id="gitCommit" aria-label="Build version"></footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
